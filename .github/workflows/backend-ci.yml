name: Backend CI

on:
  push:
    branches: [main, development]
    paths:
      - 'src/Vector.API/**'
      - 'src/Vector.Application/**'
      - 'src/Vector.Domain/**'
      - 'src/Vector.Infrastructure/**'
      - 'tests/**'
      - 'Vector.slnx'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'src/Vector.API/**'
      - 'src/Vector.Application/**'
      - 'src/Vector.Domain/**'
      - 'src/Vector.Infrastructure/**'
      - 'tests/**'
      - 'Vector.slnx'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vector.slnx

      - name: Build
        run: dotnet build Vector.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Vector.slnx --no-build --configuration Release --verbosity normal
